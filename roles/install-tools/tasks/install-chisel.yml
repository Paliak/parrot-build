- name: Downlaod chisel
  git:
    repo: 'https://github.com/jpillora/chisel'
    dest: '{{ ansible_env.HOME }}/ToolRepositories/chisel'

- name: Build chisel
  shell:
    chdir: '{{ ansible_env.HOME }}/ToolRepositories/chisel'
    cmd: 'CGO_ENABLED=0 go build -ldflags "-s -w" && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" && upx --brute chisel && upx --brute chisel.exe'
